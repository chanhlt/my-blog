services:
  db:
    image: postgres:17-alpine
    container_name: blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_password
      POSTGRES_DB: blog_db
    ports:
      - "5433:5432"
    volumes:
      - blog_db_data:/var/lib/postgresql/data

volumes:
  blog_db_data:
